<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="咖啡時光廊 - 聽故事、說故事、看故事。透過耳掛包 QR Code 連結每杯咖啡的專屬多模態回憶，享受您的專屬咖啡時光。">
    <title>咖啡時光廊 ｜ 聽咖啡說故事</title>
    
    <!-- 引入優雅的 Noto Serif TC (故事用) 與 Inter (介面用) 字型 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Noto+Serif+TC:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        /* CSS 變數定義：支援暖色系 Light/Dark 模式 */
        :root {
            --bg-primary: #fcfaf7;
            --bg-secondary: #f5ede2;
            --text-primary: #2c1f17;
            --text-secondary: #6e5849;
            --accent: #8e684d;
            --accent-hover: #73513a;
            --card-bg: #ffffff;
            --border-color: #ebdcd0;
            --shadow: 0 8px 30px rgba(44, 31, 23, 0.04);
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --font-serif: 'Noto Serif TC', serif;
            --font-sans: 'Inter', system-ui, -apple-system, sans-serif;
            --max-width: 1000px;
        }

        [data-theme="dark"] {
            --bg-primary: #120d0a;
            --bg-secondary: #1a120d;
            --text-primary: #f5ebe0;
            --text-secondary: #c9bcae;
            --accent: #dca780;
            --accent-hover: #ebbfa0;
            --card-bg: #1e150f;
            --border-color: #2d1f16;
            --shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
        }

        /* 基礎樣式與滾動條優化 */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-primary);
            font-family: var(--font-sans);
            line-height: 1.6;
            transition: var(--transition);
            overflow-x: hidden;
        }

        /* 隱藏滾動條但保持滾動 */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg-primary);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--accent);
        }

        /* 精美首頁頁首 */
        header {
            padding: 60px 20px 40px;
            text-align: center;
            background: linear-gradient(180deg, var(--bg-secondary) 0%, var(--bg-primary) 100%);
            border-bottom: 1px solid var(--border-color);
            position: relative;
        }

        /* 主題切換按鈕 */
        .theme-toggle-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.85rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: var(--shadow);
            transition: var(--transition);
        }
        .theme-toggle-btn:hover {
            transform: translateY(-2px);
            border-color: var(--accent);
        }

        .header-container {
            max-width: var(--max-width);
            margin: 0 auto;
        }

        .logo {
            font-family: var(--font-serif);
            font-size: 2.5rem;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 12px;
            letter-spacing: 2px;
            position: relative;
            display: inline-block;
        }

        .logo::after {
            content: '';
            position: absolute;
            bottom: -4px;
            left: 50%;
            transform: translateX(-50%);
            width: 40px;
            height: 2px;
            background-color: var(--accent);
        }

        header p {
            color: var(--text-secondary);
            font-size: 1.05rem;
            font-weight: 300;
            margin-top: 15px;
            letter-spacing: 1px;
        }

        /* 主要內容區 */
        main {
            max-width: var(--max-width);
            margin: 0 auto;
            padding: 40px 20px;
        }

        /* 搜尋與篩選列 */
        .search-filter-container {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 40px;
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .search-wrapper {
            position: relative;
            width: 100%;
        }

        .search-input {
            width: 100%;
            background-color: var(--bg-primary);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 12px 16px 12px 40px;
            border-radius: 8px;
            font-family: var(--font-sans);
            font-size: 0.95rem;
            outline: none;
            transition: var(--transition);
        }

        .search-input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(142, 104, 77, 0.15);
        }

        .search-icon {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-secondary);
            opacity: 0.6;
            font-size: 0.95rem;
        }

        .filter-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
        }

        .filter-label {
            font-size: 0.85rem;
            color: var(--text-secondary);
            font-weight: 500;
            margin-right: 5px;
        }

        .filter-tag {
            background-color: var(--bg-secondary);
            color: var(--text-secondary);
            border: 1px solid transparent;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            cursor: pointer;
            transition: var(--transition);
        }

        .filter-tag:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        .filter-tag.active {
            background-color: var(--accent);
            color: #ffffff;
            border-color: var(--accent);
        }

        /* 故事網格 */
        .gallery-title {
            font-family: var(--font-serif);
            font-size: 1.6rem;
            margin-bottom: 25px;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .gallery-title::after {
            content: '';
            flex-grow: 1;
            height: 1px;
            background-color: var(--border-color);
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 30px;
            margin-bottom: 60px;
        }

        /* 無資料與載入中狀態 */
        .no-results, .loading-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 50px 20px;
            color: var(--text-secondary);
            font-size: 1.05rem;
            font-weight: 300;
        }

        .loading-spinner {
            border: 3px solid var(--border-color);
            border-top: 3px solid var(--accent);
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* 故事卡片 */
        .story-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: var(--shadow);
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .story-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 12px 40px rgba(44, 31, 23, 0.08);
            border-color: var(--accent);
        }

        .card-image-wrapper {
            position: relative;
            width: 100%;
            height: 220px;
            overflow: hidden;
        }

        .card-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: var(--transition);
        }

        .story-card:hover .card-image {
            transform: scale(1.05);
        }

        .card-tag {
            position: absolute;
            top: 15px;
            left: 15px;
            background-color: rgba(44, 31, 23, 0.85);
            backdrop-filter: blur(4px);
            color: #f5ebe0;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            letter-spacing: 1px;
            z-index: 2;
        }

        .card-content {
            padding: 20px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .card-title {
            font-family: var(--font-serif);
            font-size: 1.25rem;
            color: var(--text-primary);
            margin-bottom: 10px;
            line-height: 1.4;
        }

        .card-excerpt {
            color: var(--text-secondary);
            font-size: 0.9rem;
            font-weight: 300;
            line-height: 1.6;
            margin-bottom: 20px;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .card-footer {
            margin-top: auto;
            font-size: 0.8rem;
            color: var(--accent);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        /* 互動式 Guestbook 區塊 */
        .guestbook-section {
            background-color: var(--bg-secondary);
            border-radius: 20px;
            padding: 35px;
            border: 1px solid var(--border-color);
            margin-top: 40px;
        }

        .guestbook-header {
            margin-bottom: 25px;
        }

        .guestbook-header h2 {
            font-family: var(--font-serif);
            font-size: 1.5rem;
            color: var(--text-primary);
            margin-bottom: 8px;
        }

        .guestbook-header p {
            font-size: 0.9rem;
            color: var(--text-secondary);
        }

        .guestbook-form {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
            margin-bottom: 30px;
        }

        @media (min-width: 600px) {
            .guestbook-form {
                grid-template-columns: 1fr 1fr;
            }
            .guestbook-form-message {
                grid-column: span 2;
            }
            .guestbook-form-submit {
                grid-column: span 2;
                justify-self: end;
            }
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .input-group label {
            font-size: 0.8rem;
            color: var(--text-secondary);
            font-weight: 500;
        }

        .input-group input, .input-group textarea {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 12px;
            border-radius: 8px;
            font-family: var(--font-sans);
            font-size: 0.95rem;
            outline: none;
            transition: var(--transition);
        }

        .input-group input:focus, .input-group textarea:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(142, 104, 77, 0.15);
        }

        .guestbook-form-submit button {
            background-color: var(--accent);
            color: #ffffff;
            border: none;
            padding: 12px 30px;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition);
        }

        .guestbook-form-submit button:hover {
            background-color: var(--accent-hover);
            transform: translateY(-1px);
        }

        /* 留言列表展示 */
        .comments-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
            max-height: 300px;
            overflow-y: auto;
            padding-right: 5px;
        }

        .comment-item {
            background-color: var(--card-bg);
            padding: 18px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow);
            animation: fadeIn 0.4s ease;
        }

        .comment-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            font-size: 0.8rem;
        }

        .comment-author {
            font-weight: 600;
            color: var(--accent);
        }

        .comment-date {
            color: var(--text-secondary);
            opacity: 0.8;
        }

        .comment-text {
            font-size: 0.9rem;
            color: var(--text-primary);
            white-space: pre-wrap;
        }

        /* 原生 <dialog> 故事彈窗 */
        dialog.story-dialog {
            border: none;
            border-radius: 20px;
            background-color: var(--card-bg);
            color: var(--text-primary);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2);
            width: 90%;
            max-width: 580px;
            margin: auto;
            outline: none;
            overflow: hidden;
            animation: modalFadeIn 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        /* Backdrop 樣式與濾鏡 */
        dialog.story-dialog::backdrop {
            background-color: rgba(26, 18, 13, 0.7);
            backdrop-filter: blur(8px);
            transition: var(--transition);
        }

        .dialog-container {
            display: flex;
            flex-direction: column;
            max-height: 85vh;
        }

        .dialog-header {
            padding: 25px 25px 15px;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border-color);
        }

        .dialog-title {
            font-family: var(--font-serif);
            font-size: 1.4rem;
            color: var(--text-primary);
            padding-right: 30px;
        }

        .dialog-close-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            width: 32px;
            height: 32px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            transition: var(--transition);
            z-index: 10;
        }

        .dialog-close-btn:hover {
            background-color: var(--accent);
            color: #ffffff;
            border-color: var(--accent);
            transform: rotate(90deg);
        }

        .dialog-body {
            padding: 25px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* 媒體展示區 */
        .dialog-media-container {
            width: 100%;
            border-radius: 12px;
            overflow: hidden;
            background-color: #000;
            position: relative;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.2);
        }

        .dialog-video {
            width: 100%;
            display: block;
            max-height: 320px;
            object-fit: contain;
        }

        .dialog-audio-wrapper {
            background-color: var(--bg-secondary);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .audio-cover {
            width: 100%;
            height: 180px;
            object-fit: cover;
            border-radius: 8px;
        }

        .dialog-audio {
            width: 100%;
            outline: none;
        }

        /* 故事文本 */
        .dialog-text {
            font-family: var(--font-sans);
            font-size: 1.05rem;
            line-height: 1.9;
            color: var(--text-primary);
            white-space: pre-wrap;
            font-weight: 300;
            letter-spacing: 0.5px;
        }

        /* 故事分享與操作列 */
        .dialog-footer {
            padding: 20px 25px;
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            gap: 15px;
        }

        .btn-action {
            padding: 10px 18px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background: var(--card-bg);
            color: var(--text-primary);
            font-size: 0.9rem;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-action:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        .btn-action-primary {
            background-color: var(--accent);
            color: #ffffff;
            border-color: var(--accent);
        }

        .btn-action-primary:hover {
            background-color: var(--accent-hover);
            color: #ffffff;
        }

        /* 數據來源指示器樣式 */
        .data-source-wrapper {
            margin-top: 15px;
            font-size: 0.8rem;
            color: var(--text-secondary);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
        }

        .data-source-badge {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 4px 12px;
            border-radius: 12px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-weight: 500;
        }

        .setup-guide-link {
            color: var(--accent);
            text-decoration: underline;
            cursor: pointer;
        }

        /* 頁尾 */
        footer {
            text-align: center;
            padding: 60px 20px 40px;
            color: var(--text-secondary);
            font-size: 0.85rem;
            border-top: 1px solid var(--border-color);
            background-color: var(--bg-secondary);
            margin-top: 60px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        footer p {
            margin-bottom: 5px;
        }

        /* 動畫定義 */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes modalFadeIn {
            from { opacity: 0; transform: scale(0.9) translateY(20px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        /* 行動端介面適配 */
        @media (max-width: 600px) {
            header {
                padding: 40px 15px 30px;
            }
            .logo {
                font-size: 1.8rem;
            }
            main {
                padding: 20px 15px;
            }
            .gallery-grid {
                gap: 20px;
            }
            .guestbook-section {
                padding: 20px;
            }
            dialog.story-dialog {
                width: 95%;
            }
            .dialog-footer {
                flex-direction: column;
            }
            .dialog-footer .btn-action {
                width: 100%;
                justify-content: center;
            }
        }
    </style>
</head>
<body>

    <!-- 主題切換與頁首 -->
    <header>
        <button class="theme-toggle-btn" id="themeToggleBtn" onclick="toggleTheme()" aria-label="切換深淺色主題">
            <span id="themeBtnText">🌓 切換深色</span>
        </button>
        <div class="header-container">
            <h1 class="logo">咖啡時光廊</h1>
            <p>撕開包裝，注入熱水。聽咖啡說故事，留下您的專屬記憶。</p>
        </div>
    </header>

    <main>
        <!-- 搜尋與篩選器區塊 -->
        <section class="search-filter-container">
            <div class="search-wrapper">
                <span class="search-icon">🔍</span>
                <input type="text" class="search-input" id="searchInput" placeholder="搜尋咖啡名稱、故事標題或內文..." oninput="handleSearchFilter()">
            </div>
            <div class="filter-tags">
                <span class="filter-label">篩選類別:</span>
                <button class="filter-tag active" data-category="all" onclick="setFilterCategory('all')">全部故事</button>
                <button class="filter-tag" data-category="曼特寧" onclick="setFilterCategory('曼特寧')">曼特寧</button>
                <button class="filter-tag" data-category="耶加雪菲" onclick="setFilterCategory('耶加雪菲')">耶加雪菲</button>
                <button class="filter-tag" data-category="藝伎" onclick="setFilterCategory('藝伎')">藝伎</button>
                <button class="filter-tag" data-category="其他" onclick="setFilterCategory('其他')">其他</button>
            </div>
        </section>

        <!-- 時光廊卡片區 -->
        <h2 class="gallery-title">故事時光廊</h2>
        <div class="gallery-grid" id="galleryGrid">
            <!-- 載入中動畫 -->
            <div class="loading-state" id="loadingState">
                <div class="loading-spinner"></div>
                <p>正在從雲端載入故事時光...</p>
            </div>
        </div>

        <!-- 讀者故事留言板 (說故事/互動功能) -->
        <section class="guestbook-section">
            <div class="guestbook-header">
                <h2>咖啡迴音壁</h2>
                <p>每杯咖啡都有它的回聲。在此處留下您的心情、故事或讀後感...</p>
            </div>
            <form class="guestbook-form" id="guestbookForm" onsubmit="handleCommentSubmit(event)">
                <div class="input-group">
                    <label for="commentAuthor">稱呼 (Nickname)</label>
                    <input type="text" id="commentAuthor" required placeholder="例如：躲雨的旅人">
                </div>
                <div class="input-group">
                    <label for="commentCoffee">品嚐的咖啡 (Coffee type)</label>
                    <input type="text" id="commentCoffee" placeholder="例如：Vol.01 曼特寧">
                </div>
                <div class="input-group guestbook-form-message">
                    <label for="commentContent">留下您的故事或回響...</label>
                    <textarea id="commentContent" rows="4" required placeholder="熱水注入的那一刻，我想起了..."></textarea>
                </div>
                <div class="guestbook-form-submit">
                    <button type="submit">留下印記</button>
                </div>
            </form>

            <div class="comments-list" id="commentsList">
                <!-- 留言將在此處動態渲染 -->
            </div>
        </section>
    </main>

    <!-- 原生故事彈窗 dialog -->
    <dialog id="storyDialog" class="story-dialog" closedby="any" aria-labelledby="dialogTitle">
        <div class="dialog-container">
            <div class="dialog-header">
                <h2 class="dialog-title" id="dialogTitle">故事加載中...</h2>
                <button class="dialog-close-btn" onclick="closeStoryDialog()" aria-label="關閉彈窗">×</button>
            </div>
            <div class="dialog-body" id="dialogBody">
                <!-- 故事多模態內容將在此渲染 -->
            </div>
            <div class="dialog-footer">
                <button class="btn-action" onclick="copyStoryLink()">
                    🔗 分享此故事
                </button>
                <button class="btn-action btn-action-primary" onclick="closeStoryDialog()">
                    讀完了
                </button>
            </div>
        </div>
    </dialog>

    <footer>
        <p>© 2026 喝咖聽故事 MVP ｜ 享受重力之外的純粹時光</p>
        <p style="font-size: 0.75rem; opacity: 0.6;">Powered by Antigravity Engine</p>
        
        <!-- 資料來源提示 -->
        <div class="data-source-wrapper">
            <div class="data-source-badge" id="dataSourceBadge">
                <span>🟤 載入中...</span>
            </div>
            <span class="setup-guide-link" onclick="showSetupGuide()">如何將我的 Google 試算表同步到這裡？</span>
        </div>
    </footer>

    <script>
        // ==================== 1. Google 試算表設定 (關鍵！) ====================
        // 請在此處填入您的 Google 試算表 ID。
        // 例如：https://docs.google.com/spreadsheets/d/12345abcdefg/edit 中的 '12345abcdefg'
        // 注意：試算表必須設定為「知道連結的人均可檢視」，並且在選單點選「檔案 ➔ 共用 ➔ 發布到網路」！
        const GOOGLE_SHEET_ID = ''; 

        // 預設的初始本地故事資料庫 (若試算表未設定或載入失敗時的備用/降級方案)
        const defaultStories = {
            "1": {
                id: "1",
                tag: "Vol.01 曼特寧",
                title: "午後的低語：雨中的東京書店",
                cover: "https://images.unsplash.com/photo-1514432324607-a09d9b4aefdd?w=600&auto=format&fit=crop&q=80",
                excerpt: "熱水緩緩落下，隨著蒸氣升騰的是東京細雨的味道。那年你在轉角舊書店躲雨，遇見了同樣沒帶傘的旅人...",
                type: "video",
                mediaUrl: "https://assets.mixkit.co/videos/preview/mixkit-coffee-is-poured-into-a-cup-32881-large.mp4",
                text: "熱水緩緩落下，隨著蒸氣升騰的是東京細雨的味道。\n\n那年你在神保町轉角的舊書店躲雨，書架旁飄散著淡淡的油墨香氣。你拍拍外套上的水珠，轉身便遇見了同樣沒有帶傘的旅人，他手裡正捧著一本泛黃的詩集。\n\n「你也喜歡讀這首詩嗎？」他指了指扉頁。\n\n咖啡的甘苦與當年的青澀，在今天下午的這杯曼特寧溫熱中，完美地重疊、融合。"
            },
            "2": {
                id: "2",
                tag: "Vol.02 耶加雪菲",
                title: "微酸的記憶：那年夏天的海風",
                cover: "https://images.unsplash.com/photo-1495474472287-4d71bcdd2085?w=600&auto=format&fit=crop&q=80",
                excerpt: "耶加雪菲特有的柑橘微酸，一入口，就把你帶回了花蓮的那片海。浪花拍打著腳踝，收音機裡放著模糊的歌...",
                type: "audio",
                mediaUrl: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3",
                text: "耶加雪菲特有的柑橘與茉莉微酸，甫一入口，那一股微風就把你帶回了花蓮的那片盛夏之海。\n\n浪花溫柔地拍打著腳踝，沙灘上散落著貝殼與回憶。你們並肩坐在漂流木上，身旁的收音機正放著模糊的獨立樂團歌曲，歌聲有些沙啞，但那時我們都相信世界可以被歌聲改變。\n\n那是我們決定不帶行李、隨性出發流浪的起點。如今，那股微酸的柑橘香氣，依舊如同海風般乾淨。"
            },
            "3": {
                id: "3",
                tag: "Vol.03 藝伎 Geisha",
                title: "晨曦微光：衣索比亞高原的低喃",
                cover: "https://images.unsplash.com/photo-1507133750040-4a8f57021571?w=600&auto=format&fit=crop&q=80",
                excerpt: "佛手柑與水蜜桃的精緻芬芳，如同高山清晨的第一縷陽光。這不僅僅是一杯咖啡，更是一次靈魂的甦醒...",
                type: "audio",
                mediaUrl: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3",
                text: "佛手柑與水蜜桃的精緻芬芳，如同衣索比亞高原清晨的第一縷晨曦陽光，撥開了層層雲霧。\n\n這不僅僅是一杯咖啡，更是一次靈魂的甦醒。在喧囂都市的清晨，你拉開窗簾，聽著這款極具花香層次感的藝伎低喃，彷彿能看見咖啡農夫在薄霧中採摘鮮紅漿果的純粹身影。\n\n沉靜下來，給自己五分鐘。在花香繚繞中，重拾面對一整天挑戰的勇氣。"
            }
        };

        let storyDatabase = {};
        let activeStoryId = null;
        let currentFilterCategory = 'all';

        // 2. 初始化流程
        document.addEventListener('DOMContentLoaded', () => {
            loadComments();
            initTheme();
            // 從 Google 試算表或本地載入資料
            loadStoriesData().then(() => {
                handleUrlRouting();
            });
        });

        // 核心資料加載器：串接 Google 試算表
        async function loadStoriesData() {
            const badge = document.getElementById('dataSourceBadge');
            
            if (!GOOGLE_SHEET_ID || GOOGLE_SHEET_ID === 'YOUR_GOOGLE_SHEET_ID_HERE') {
                // 未設定 Sheet ID ➔ 降級使用內建本地故事資料
                console.log("未設定 GOOGLE_SHEET_ID，使用內建備用資料。");
                storyDatabase = { ...defaultStories };
                badge.innerHTML = `<span>🟤 網頁內置預設故事</span>`;
                renderGallery();
                return;
            }

            try {
                // 串接 Google Visualization API 格式化端點讀取試算表
                const url = `https://docs.google.com/spreadsheets/d/${GOOGLE_SHEET_ID}/gviz/tq?tqx=out:json`;
                const response = await fetch(url);
                if (!response.ok) throw new Error("網路請求失敗");
                
                const text = await response.text();
                // 移除 Google 返回的外部 JavaScript 套件函數包裝
                const jsonStart = text.indexOf('{');
                const jsonEnd = text.lastIndexOf('}');
                const jsonString = text.substring(jsonStart, jsonEnd + 1);
                const data = JSON.parse(jsonString);

                const rows = data.table.rows;
                const tempDb = {};

                rows.forEach(row => {
                    const cells = row.c;
                    if (!cells || cells.length < 8) return; // 欄位至少要有 8 欄
                    
                    // 解析每列儲存格
                    const id = cells[0] ? String(cells[0].v || '').trim() : '';
                    if (!id) return; // ID 為必填

                    tempDb[id] = {
                        id: id,
                        tag: cells[1] ? String(cells[1].v || '') : '',
                        title: cells[2] ? String(cells[2].v || '') : '',
                        cover: cells[3] ? String(cells[3].v || '') : '',
                        excerpt: cells[4] ? String(cells[4].v || '') : '',
                        type: cells[5] ? String(cells[5].v || 'audio').toLowerCase().trim() : 'audio',
                        mediaUrl: cells[6] ? String(cells[6].v || '') : '',
                        text: cells[7] ? String(cells[7].v || '') : ''
                    };
                });

                if (Object.keys(tempDb).length === 0) {
                    throw new Error("試算表解析出 0 筆資料");
                }

                storyDatabase = tempDb;
                badge.innerHTML = `<span style="color: #47782e;">🟢 雲端 Google 試算表同步中</span>`;
                console.log("成功從 Google Sheets 載入故事資料！共載入 " + Object.keys(storyDatabase).length + " 筆。");
            } catch (err) {
                console.error("無法從 Google Sheets 載入資料，已降級啟用本地預設故事：", err);
                storyDatabase = { ...defaultStories };
                badge.innerHTML = `<span style="color: #d9534f;">🔴 雲端連線失敗，已啟動備用資料</span>`;
            }

            renderGallery();
        }

        // ==================== 搜尋與篩選邏輯 ====================
        function setFilterCategory(category) {
            currentFilterCategory = category;
            
            // 更新篩選標籤 UI
            const tags = document.querySelectorAll('.filter-tag');
            tags.forEach(tag => {
                if (tag.getAttribute('data-category') === category) {
                    tag.classList.add('active');
                } else {
                    tag.classList.remove('active');
                }
            });

            handleSearchFilter();
        }

        function handleSearchFilter() {
            const query = document.getElementById('searchInput').value.toLowerCase().trim();
            const filteredStories = Object.values(storyDatabase).filter(story => {
                // 1. 類別篩選
                let categoryMatch = false;
                if (currentFilterCategory === 'all') {
                    categoryMatch = true;
                } else if (currentFilterCategory === '其他') {
                    categoryMatch = !story.tag.includes('曼特寧') && !story.tag.includes('耶加雪菲') && !story.tag.includes('藝伎');
                } else {
                    categoryMatch = story.tag.includes(currentFilterCategory);
                }

                // 2. 關鍵字搜尋 (標題、分類標籤、簡介、全文)
                const keywordMatch = !query || 
                    story.title.toLowerCase().includes(query) ||
                    story.tag.toLowerCase().includes(query) ||
                    story.excerpt.toLowerCase().includes(query) ||
                    story.text.toLowerCase().includes(query);

                return categoryMatch && keywordMatch;
            });

            renderGalleryItems(filteredStories);
        }

        // 渲染故事卡片至 Gallery 網格
        function renderGallery() {
            renderGalleryItems(Object.values(storyDatabase));
        }

        function renderGalleryItems(storiesArray) {
            const grid = document.getElementById('galleryGrid');
            grid.innerHTML = '';
            
            if (storiesArray.length === 0) {
                grid.innerHTML = `<div class="no-results">🔍 找不到符合搜尋或篩選條件的故事。</div>`;
                return;
            }

            storiesArray.forEach(story => {
                const card = document.createElement('article');
                card.className = 'story-card';
                card.onclick = () => openStoryDialog(story.id);
                card.innerHTML = `
                    <div class="card-image-wrapper">
                        <span class="card-tag">${story.tag}</span>
                        <img class="card-image" src="${story.cover}" alt="${story.title}" loading="lazy">
                    </div>
                    <div class="card-content">
                        <h3 class="card-title">${story.title}</h3>
                        <p class="card-excerpt">${story.excerpt}</p>
                        <div class="card-footer">
                            <span>🕒 閱讀時間約 2 分鐘</span>
                            <span>閱讀故事 →</span>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        // ==================== 故事彈窗邏輯 ====================
        const dialog = document.getElementById('storyDialog');

        function openStoryDialog(id) {
            const story = storyDatabase[id];
            if (!story) return;
            
            activeStoryId = id;
            document.getElementById('dialogTitle').textContent = story.title;
            
            // 根據多模態媒體類型渲染媒體播放器
            let mediaHtml = '';
            if (story.type === 'video') {
                mediaHtml = `
                    <div class="dialog-media-container">
                        <video class="dialog-video" id="dialogVideo" controls playsinline>
                            <source src="${story.mediaUrl}" type="video/mp4">
                            您的瀏覽器不支援影片播放。
                        </video>
                    </div>
                `;
            } else if (story.type === 'audio') {
                mediaHtml = `
                    <div class="dialog-audio-wrapper">
                        <img class="audio-cover" src="${story.cover}" alt="${story.title}">
                        <audio class="dialog-audio" id="dialogAudio" controls>
                            <source src="${story.mediaUrl}" type="audio/mpeg">
                            您的瀏覽器不支援音訊播放。
                        </audio>
                    </div>
                `;
            }

            const bodyContainer = document.getElementById('dialogBody');
            bodyContainer.innerHTML = `
                ${mediaHtml}
                <div class="dialog-text">${story.text}</div>
            `;

            // 修改網址列 Hash 便於分享或 QR Code 路由
            window.location.hash = `story-${id}`;
            
            dialog.showModal();
        }

        function closeStoryDialog() {
            // 停止影音播放
            const video = document.getElementById('dialogVideo');
            const audio = document.getElementById('dialogAudio');
            if (video) video.pause();
            if (audio) audio.pause();

            dialog.close();
            activeStoryId = null;

            // 清除網址 Hash 但不重新整理頁面
            history.pushState("", document.title, window.location.pathname + window.location.search);
        }

        // 相容性 Light-dismiss (點擊彈窗外部關閉)
        if (!('closedBy' in HTMLDialogElement.prototype)) {
            dialog.addEventListener('click', (event) => {
                if (event.target !== dialog) return;
                
                const rect = dialog.getBoundingClientRect();
                const isDialogContent = (
                    rect.top <= event.clientY &&
                    event.clientY <= rect.top + rect.height &&
                    rect.left <= event.clientX &&
                    event.clientX <= rect.left + rect.width
                );
                
                if (!isDialogContent) {
                    closeStoryDialog();
                }
            });
        }

        // URL 路由與 QR Code 導流核心邏輯
        function handleUrlRouting() {
            const urlParams = new URLSearchParams(window.location.search);
            const queryId = urlParams.get('v'); // 獲取 ?v=1 中的 1
            const hashId = window.location.hash.replace('#story-', ''); // 獲取 #story-1 中的 1
            
            const targetId = queryId || hashId;
            if (targetId && storyDatabase[targetId]) {
                setTimeout(() => {
                    openStoryDialog(targetId);
                }, 300);
            }
        }

        // 複製分享連結
        function copyStoryLink() {
            if (!activeStoryId) return;
            const shareUrl = `${window.location.origin}${window.location.pathname}?v=${activeStoryId}`;
            
            navigator.clipboard.writeText(shareUrl).then(() => {
                alert('連結已複製到剪貼簿，快分享給朋友吧！\n' + shareUrl);
            }).catch(err => {
                console.error('複製失敗:', err);
                alert('分享連結為: ' + shareUrl);
            });
        }

        // ==================== 試算表教學彈窗 ====================
        function showSetupGuide() {
            alert(
                "如何使用 Google 試算表維護故事？\n\n" +
                "1. 在 Google 雲端新增一個試算表。\n" +
                "2. 建立以下 8 個欄位 (從 A 到 H 欄，第一列為標題)：\n" +
                "   A: ID  (編號，例如 1)\n" +
                "   B: 標籤  (例如 Vol.01 曼特寧)\n" +
                "   C: 標題  (例如 雨中的東京書店)\n" +
                "   D: 封面圖網址 (圖片連結)\n" +
                "   E: 簡介 (卡片摘要)\n" +
                "   F: 類型 (必須填 video 或 audio)\n" +
                "   G: 影音網址 (直連連結)\n" +
                "   H: 故事內文 (正文內容)\n\n" +
                "3. 點選試算表「共用」➔ 將權限設為「知道連結的人均可檢視」。\n" +
                "4. 點選「檔案」➔「共用」➔「發布到網路」，點擊「發布」。\n" +
                "5. 複製試算表網址中的 ID，並填入程式碼中的 `GOOGLE_SHEET_ID` 變數中！\n\n" +
                "完成後，網頁就會永久自動抓取您的試算表作為資料庫！"
            );
        }

        // ==================== 留言板功能 (LocalStorage 本地儲存) ====================
        function handleCommentSubmit(event) {
            event.preventDefault();
            
            const author = document.getElementById('commentAuthor').value.trim();
            const coffee = document.getElementById('commentCoffee').value.trim() || '品味咖啡';
            const content = document.getElementById('commentContent').value.trim();
            
            if (!author || !content) return;
            
            const newComment = {
                id: Date.now(),
                author,
                coffee,
                content,
                date: new Date().toLocaleString('zh-TW', { hour12: false })
            };
            
            let comments = JSON.parse(localStorage.getItem('coffee_comments') || '[]');
            comments.unshift(newComment);
            localStorage.setItem('coffee_comments', JSON.stringify(comments));
            
            // 重置表單與更新渲染
            document.getElementById('guestbookForm').reset();
            renderComments(comments);
        }

        function loadComments() {
            const defaultComments = [
                {
                    id: 1,
                    author: "文青旅人",
                    coffee: "Vol.01 曼特寧",
                    content: "今天點了這款咖啡，掃碼看到東京書店的故事，那一瞬間，嘴裡的苦味突然多了一絲溫暖的厚度，真是美妙的設計！",
                    date: "2026-06-11 16:30"
                },
                {
                    id: 2,
                    author: "海風吹吹",
                    coffee: "Vol.02 耶加雪菲",
                    content: "耶加雪菲的微酸真的跟海風故事超搭！一邊聽著海浪音樂，一邊喝著帶酸甜柑橘味的咖啡，感覺整個人回到了花蓮的假期。",
                    date: "2026-06-11 17:15"
                }
            ];
            
            let comments = localStorage.getItem('coffee_comments');
            if (!comments) {
                localStorage.setItem('coffee_comments', JSON.stringify(defaultComments));
                comments = defaultComments;
            } else {
                comments = JSON.parse(comments);
            }
            
            renderComments(comments);
        }

        function renderComments(comments) {
            const list = document.getElementById('commentsList');
            list.innerHTML = '';
            
            comments.forEach(comment => {
                const commentDiv = document.createElement('div');
                commentDiv.className = 'comment-item';
                commentDiv.innerHTML = `
                    <div class="comment-meta">
                        <span class="comment-author">👤 ${comment.author} <small style="color: var(--text-secondary); font-weight:normal;">(品嚐了 ${comment.coffee})</small></span>
                        <span class="comment-date">${comment.date}</span>
                    </div>
                    <div class="comment-text">${comment.content}</div>
                `;
                list.appendChild(commentDiv);
            });
        }

        // ==================== 主題切換 (LocalStorage 儲存狀態) ====================
        function initTheme() {
            const savedTheme = localStorage.getItem('theme') || 'light';
            document.documentElement.setAttribute('data-theme', savedTheme);
            updateThemeBtnUI(savedTheme);
        }

        function toggleTheme() {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
            updateThemeBtnUI(newTheme);
        }

        function updateThemeBtnUI(theme) {
            const btnText = document.getElementById('themeBtnText');
            if (theme === 'dark') {
                btnText.textContent = '☀️ 切換淺色';
            } else {
                btnText.textContent = '🌙 切換深色';
            }
        }
    </script>
</body>
</html>
